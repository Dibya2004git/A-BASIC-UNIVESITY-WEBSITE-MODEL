<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dharanidhar University | Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}
header{background:#0b3d91;color:#fff;padding:15px 40px;display:flex;justify-content:space-between}
nav a{color:#fff;margin-left:18px;text-decoration:none}
.section{padding:70px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.form{background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:6px}
button{background:#0b3d91;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer}
.info{background:#f3f6fb;padding:22px;border-radius:12px}
footer{background:#111;color:#ddd;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <strong>Dharanidhar University</strong>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="courses.html">Courses</a>
    <a href="admissions.html">Admissions</a>
  </nav>
</header>

<section class="section">
  <div class="info">
    <h2>Contact Information</h2>
    <p><strong>Address:</strong> Knowledge Park, City, India</p>
    <p><strong>Email:</strong> info@myuniversity.edu</p>
    <p><strong>Phone:</strong> +91 90000 00000</p>
    <p><strong>Office Hours:</strong> Mon–Fri, 9 AM – 5 PM</p>
  </div>
</section>
<form class="form" onsubmit="return validateForm()">
  <h2>Get in Touch</h2>
  <input type="text" id="name" placeholder="Your Name">
  <input type="email" id="email" placeholder="Your Email">
  <textarea id="msg" rows="4" placeholder="Message"></textarea>
  <button type="submit">Send Message</button>
  <p id="status"></p>
</form>

<script>
function validateForm(){
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let msg = document.getElementById("msg").value.trim();

  if(name === "" || email === "" || msg === ""){
    document.getElementById("status").innerText = "❌ Please fill all fields";
    return false;
  }

  document.getElementById("status").innerText = "✅ Message sent successfully!";
  return false; // demo only (no backend)
}
</script>


<footer>© 2026 Dharanidhar University</footer>
</body>
</html>
